name: Build and test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.component }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: daemon
            gadget: 'OFF'
            packages: libdbus-1-dev libsystemd-dev
          - component: qt
            gadget: 'ON'
            packages: libdbus-1-dev libsystemd-dev qt6-base-dev qt6-declarative-dev libx11-dev libxtst-dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential cmake ninja-build pkg-config ${{ matrix.packages }}
      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DBUILD_DAEMON=ON -DBUILD_GADGET=${{ matrix.gadget }} -DBUILD_TESTS=ON
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure --no-tests=error
      - name: Verify installed executables
        run: |
          prefix="$RUNNER_TEMP/openwheel"
          cmake --install build --prefix "$prefix"
          test -x "$prefix/bin/asus_wheel"
          if [ '${{ matrix.gadget }}' = 'ON' ]; then
            test -x "$prefix/bin/openwheel-gadget"
            ldd "$prefix/bin/openwheel-gadget" > "$RUNNER_TEMP/gadget-libraries.txt"
            if grep -F 'not found' "$RUNNER_TEMP/gadget-libraries.txt"; then
              exit 1
            fi
          fi
